name: tablecheck-watch

on:
  schedule:
    - cron: "*/15 8-14 * * *"   # JST 17:00〜23:45 に15分ごと(UTC表記)
  workflow_dispatch:
    inputs:
      debug:
        description: "デバッグ出力(1で有効)"
        default: "0"
      test_line:
        description: "LINEテスト通知のみ送る(1で有効)"
        default: "0"

concurrency:
  group: tablecheck-watch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python check_tablecheck.py
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TARGET_DATES: ${{ vars.TARGET_DATES }}
          PAX: ${{ vars.PAX }}
          SHOP_URL: ${{ vars.SHOP_URL }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          DEBUG: ${{ github.event.inputs.debug || '0' }}
          TEST_LINE: ${{ github.event.inputs.test_line || '0' }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('state/last.json') != ''
        with:
          path: state
          key: state-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.debug == '1'
        with:
          name: debug
          path: debug
